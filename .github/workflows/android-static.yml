name: "Android Static arm64 \u2014 Build, Pack, Release, Purge"

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: "r27c"
  API_LEVEL: "30"
  TARGET: "aarch64-linux-android30"
  SRC_DIR: "src"
  OUT_DIR: "out"
  RELEASE_NAME: "android-arm64-api30-static"

jobs:
  build-and-release:
    name: android-arm64-api30-static
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "\U0001F4E5 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "\U0001F916 Setup Android NDK"
        uses: android-actions/setup-android@v3
        with:
          ndk-version: "${{ env.NDK_VERSION }}"

      - name: "\U0001F50D Discover sources"
        id: discover
        run: |
          chmod +x .github/scripts/discover.sh
          .github/scripts/discover.sh

      - name: "\U0001F528 Build each binary"
        run: |
          chmod +x .github/scripts/build.sh
          .github/scripts/build.sh

      - name: "\U0001F4E6 Pack archive"
        id: pack
        run: |
          chmod +x .github/scripts/pack.sh
          .github/scripts/pack.sh

      - name: "\U0001F3F7\uFE0F Create Release"
        run: |
          chmod +x .github/scripts/release.sh
          .github/scripts/release.sh "${{ steps.pack.outputs.archive }}"

      - name: "\U0001F4A5 Purge sources"
        if: always()
        run: |
          chmod +x .github/scripts/purge.sh
          .github/scripts/purge.sh